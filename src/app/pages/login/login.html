
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">F</div>
      <h1>Foggerithm</h1>
      <p>Smart control for your growing environment</p>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to manage your devices and schedules.</p>

    <div class="error-message" *ngIf="errorMessage" role="alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="you@example.com"
        autocomplete="email"
      />

      <small
        class="field-error"
        *ngIf="loginForm.controls.email.touched &&
               loginForm.controls.email.invalid"
      >
        Enter a valid email address.
      </small>

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      />

      <small
        class="field-error"
        *ngIf="loginForm.controls.password.touched &&
               loginForm.controls.password.invalid"
      >
        Password is required.
      </small>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Create an account</a>
    </p>
  </div>
</div>
